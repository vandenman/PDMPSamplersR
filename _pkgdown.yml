url: https://vandenman.github.io/PDMPSamplersR/

template:
  bootstrap: 5

home:
  title: PDMPSamplersR
  description: >
    R interface to PDMPSamplers.jl for Bayesian inference with
    Piecewise Deterministic Markov Processes.

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github, main-docs]
  components:
    main-docs:
      text: "Full Documentation"
      href: https://vandenman.github.io/PDMPSamplers.jl/dev/
      icon: fa-book
    github:
      icon: fa-github
      aria-label: GitHub
      href: https://github.com/vandenman/PDMPSamplersR

reference:
  - title: Sampling
    contents:
      - pdmp_sample
      - pdmp_sample_from_stanmodel
      - support_boundary_control
      - write_stan_json
      - stan_marked_subsampling
      - stan_residual_envelope
      - omrf_residual_envelope
      - compile_pdmp_stan_model
      - pdmp_subsample_hpp_path
      - stan_parameter_mapping
  - title: Results
    contents:
      - materialize
      - mean.pdmp_result
      - median.pdmp_result
      - var.pdmp_result
      - var
      - sd
      - cov.pdmp_result
      - cov
      - cor.pdmp_result
      - cor
      - quantile.pdmp_result
      - ess
      - inclusion_probs
      - cdf
      - discretize
  - title: Transforms
    contents:
      - identity_transform
      - lower_transform
      - upper_transform
      - double_transform
  - title: Priors
    contents:
      - bernoulli
      - betabernoulli
      - independent_slab_density
      - loglinear_gaussian_scale_slab
  - title: brms interface
    contents:
      - brm_pdmp
      - brm_stancode
      - brm_standata
  - title: Variable selection
    contents:
      - model_averaged_mean
      - inclusion_prob
      - check_inclusion_stability
      - inclusion_bf
      - plot_inclusion
      - median_probability_model
  - title: Setup
    contents:
      - pdmpsamplers_setup
      - pdmpsamplers_update
      - pdmpsamplers_status
      - use_local_pdmpsamplers
      - check_for_julia_setup
